schema_name: schema_tender
doc_type: NZ government tender notice
doc_id_prefix: GETS
input_glob: data/raw/tender/*.pdf
review_threshold: 0.7
max_chars: 12000
system_prompt: >
  You extract fields from the document type named below.
  Return JSON only. Use null when a field is not in the document.
  Never guess. For every value give a short verbatim quote as evidence.
fields:
  - name: agency
    type: string
    required: true
    description: The name of the organisation issuing the tender, as printed in the breadcrumb after "GETS >".
    keywords: [agency, organisation, issued by]
  - name: title
    type: string
    required: true
    description: The tender name, as printed after "Tender Name".
    keywords: [title, tender name]
  - name: reference
    type: string
    required: true
    description: The RFx ID number of the notice. Digits only. Not the "Reference #" value.
    validate_regex: "^[0-9]{6,10}$"
    keywords: [reference, RFx, ID]
  - name: close_date
    type: date
    required: true
    description: The date the tender closes. Date only, no time.
    keywords: [close, closing, deadline]
  - name: category
    type: string
    required: false
    description: Every entry listed under Categories, each as printed ("code - name"). Join several with "; " in alphabetical order.
    keywords: [category, UNSPSC]
  - name: region
    type: string
    required: false
    description: Every region listed under Regions, as printed. Join several with "; " in alphabetical order.
    keywords: [region, location]
  - name: contact_name
    type: string
    required: false
    description: The contact name printed after "Contact" (a person or a team). No job title, email or phone.
    keywords: [contact, enquiries]
