schema_name: schema_tender
doc_type: NZ government tender notice
doc_id_prefix: GETS
input_glob: data/raw/tender/*.pdf
review_threshold: 0.7
max_chars: 12000
system_prompt: >
  You extract fields from the document type named below.
  Return JSON only. Use null when a field is not in the document.
  Never guess. For every value give a short verbatim quote as evidence.
fields:
  - name: agency
    type: string
    required: true
    description: The government agency issuing the tender, as printed.
    keywords: [agency, organisation, issued by]
  - name: title
    type: string
    required: true
    description: The title of the tender notice, as printed.
    keywords: [title, tender name]
  - name: reference
    type: string
    required: true
    description: The tender reference or RFx ID.
    validate_regex: "^[A-Za-z0-9 ./_-]{3,40}$"
    keywords: [reference, RFx, ID]
  - name: close_date
    type: date
    required: true
    description: The date the tender closes. Date only, no time.
    keywords: [close, closing, deadline]
  - name: category
    type: string
    required: false
    description: The procurement category as labelled on the notice. Join several with "; " in alphabetical order.
    keywords: [category, UNSPSC]
  - name: region
    type: string
    required: false
    description: The region or regions the tender covers, as labelled on the notice. Join several with "; " in alphabetical order.
    keywords: [region, location]
  - name: contact_name
    type: string
    required: false
    description: The name of the contact person only. No job title, email or phone.
    keywords: [contact, enquiries]
